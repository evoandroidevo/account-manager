name: Release

# Builds standalone Linux and Windows archives (the server plus its site/
# folder). v* tags attach them to a new GitHub release; a manual run only
# keeps them as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc (2.35), so the binary runs on more distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: server
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: server.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: account-manager-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.11

      - name: Build
        run: cargo leptos build --release --cargo-locked
        env:
          # Link the C runtime into the .exe, so it runs on Windows installs
          # without the Visual C++ Redistributable (VCRUNTIME140.dll). Only
          # applies to the Windows target, not the wasm build.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

      - name: Package
        run: |
          mkdir -p "dist/$NAME"
          cp "target/release/${{ matrix.exe }}" "dist/$NAME/account-manager${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp -r target/site "dist/$NAME/site"
          cp config.example.yaml README.md LICENSE "dist/$NAME/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
