# Copy to config.yaml (or point APP_CONFIG at another path).
# Any value can be overridden with environment variables shaped like
# APP__SECTION__KEY, e.g. APP__LDAP__PASSWORD=... - use that for secrets.

server:
  # Externally visible origin; POSTs from any other Origin are refused (CSRF).
  # Must match exactly what the browser shows, e.g. http://127.0.0.1:3000 locally.
  public_url: https://account.dyslexicevo.dev
  # Honour X-Forwarded-For for the client IP. Only enable behind Caddy.
  trust_proxy_headers: true

database:
  url: sqlite://./data/account-manager.db

ldap:
  http_url: http://lldap:17170
  ldap_url: ldap://lldap:3890
  use_tls: false
  tls_insecure_skip_verify: false
  # tls_ca_file: /path/to/custom-ca.pem
  base_dn: dc=dyslexicevo,dc=dev
  # Service account allowed to create users and set passwords
  # (member of lldap_admin or lldap_password_manager).
  username: account-manager
  password: change-me # prefer APP__LDAP__PASSWORD

invites:
  expiration_hours: 48
  # Groups pre-selected on the admin invite form
  default_groups: [user, jelly]

session:
  cookie_name: am_session
  # false only for local development over plain HTTP
  secure_cookie: true
  idle_timeout_minutes: 60
  absolute_timeout_hours: 12

auth:
  # LLDAP group whose members see the admin pages
  admin_group: admins
  login_max_attempts: 5
  login_window_minutes: 15

mail:
  # smtp | file (writes .eml files to outbox_dir; dev/tests) | log (only logs)
  transport: smtp
  from: "Account Manager <no-reply@dyslexicevo.dev>"
  smtp:
    host: mail.smtp2go.com
    port: 587
    starttls: true # false = implicit TLS (usually port 465)
    username: change-me
    password: change-me # prefer APP__MAIL__SMTP__PASSWORD
  outbox_dir: ./data/outbox
  email_change_link_hours: 24

password_policy:
  minimum_length: 12
  require_uppercase: true
  require_lowercase: true
  require_number: true
  require_special: true

# --- Services whose accounts follow each user's tier -------------------------
# Accounts are created and updated by a background worker. Jellyfin and Seerr
# administrators (and Seerr's owner account) are never modified.

jellyfin:
  enabled: true
  url: http://192.168.1.19:8096
  # Dashboard -> API Keys. Prefer APP__JELLYFIN__API_KEY.
  api_key: change-me
  # Login provider for accounts created here, so users sign in with their
  # LLDAP password (needs the LDAP plugin). Check GET /Auth/Providers if unsure.
  auth_provider_id: Jellyfin.Plugin.LDAP_Auth.LdapAuthenticationProviderPlugin
  password_reset_provider_id: Jellyfin.Plugin.LDAP_Auth.LdapAuthenticationProviderPlugin

seerr:
  enabled: true
  # Reach Seerr directly (container name or LAN address), not through Caddy:
  # the public hostname sits behind Authelia and would block API calls.
  url: http://seerr:5055
  # Settings -> General -> API Key. Prefer APP__SEERR__API_KEY.
  api_key: change-me

# --- Tiers ---------------------------------------------------------------------
# Everyone is on default_tier unless an admin sets another on /admin/users
# (and, later, a Whop payment). Group membership is managed only for groups
# listed under some tier; other groups are left alone.

default_tier: free

tiers:
  - id: free
    name: Free
    description: One stream at a time, standard quality away from home, no transcoding(If device doesnt support video wont play).
    lldap_groups: [user, jelly]
    jellyfin:
      max_active_sessions: 1 # 0 = unlimited
      remote_bitrate_limit_mbps: 8 # 0 = unlimited
      transcoding: false
      downloads: false
      # libraries: [Movies, Shows]  # leave out for all libraries
    seerr:
      movie_quota: { limit: 1, days: 7 } # leave out to use Seerr's global default
      tv_quota: { limit: 1, days: 7 }
      permissions: [REQUEST]

  - id: plus
    name: Plus
    description: Three streams, higher quality, transcoding and more requests.
    price_label: "$5/month"
    lldap_groups: [user, jelly, plus]
    jellyfin:
      max_active_sessions: 3
      remote_bitrate_limit_mbps: 15
      transcoding: true
      downloads: false
    seerr:
      movie_quota: { limit: 3, days: 7 }
      tv_quota: { limit: 3, days: 14 }
      permissions: [REQUEST]

  - id: premium
    name: Premium
    description: Five streams, up to high end 1080p quality streaming, downloads and more requests.
    price_label: "$15/month"
    lldap_groups: [user, jelly, premium]
    jellyfin:
      max_active_sessions: 5
      remote_bitrate_limit_mbps: 25
      transcoding: true
      downloads: true
    seerr:
      movie_quota: { limit: 5, days: 7 }
      tv_quota: { limit: 4, days: 14 }
      permissions: [REQUEST]

  - id: premiumplus
    name: Premium+
    description: Unlimited streams, Up to 4k quality streaming, downloads, auto approved requests and live TV(Once available).
    price_label: "$20/month"
    lldap_groups: [user, jelly, premiumplus]
    jellyfin:
      max_active_sessions: 0
      remote_bitrate_limit_mbps: 75
      transcoding: true
      downloads: true
    seerr:
      movie_quota: { limit: 5, days: 7 }
      tv_quota: { limit: 4, days: 14 }
      permissions: [REQUEST, AUTO_APPROVE]
